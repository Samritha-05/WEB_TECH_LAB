<!DOCTYPE html>
<html>
<head>
    <title>Cake Shop</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            width: 360px;
            margin: 20px auto;
        }

        .title {
            background-color: #d90000;
            color: white;
            text-align: center;
            padding: 5px;
            font-size: 14px;
        }

        .cakes {
            display: flex;
            justify-content: space-between;
        }

        .cake {
            width: 85px;
            text-align: center;
            font-size: 7px;
        }

        .cake img {
            width: 85px;
            height: 105px;
        }

        h2 {
            text-align: center;
            color: #1769c2;
            font-size: 18px;
            margin: 10px 0;
        }

        label {
            display: block;
            color: #1249a0;
            font-weight: bold;
            font-size: 9px;
            margin-top: 5px;
        }

        input {
            width: 100%;
            height: 20px;
            box-sizing: border-box;
            margin-top: 2px;
        }

        button {
            display: block;
            width: 140px;
            margin: 5px auto;
            background-color: #087bf5;
            color: white;
            border: none;
            height: 18px;
            font-size: 8px;
            border-radius: 2px;
        }

        hr {
            border: none;
            border-top: 1px solid blue;
        }

        .bill {
            text-align: center;
            color: green;
            font-size: 14px;
            font-weight: bold;
        }

        .price {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .total {
            background-color: #22a447;
            color: white;
            padding: 2px 50px;
            font-size: 14px;
        }

        .amount {
            color: #d72d2d;
            font-size: 16px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="title">
        CAKE SHOP
    </div>

    <div class="cakes">

        <div class="cake">
            <img src="C:\Users\91882\Pictures\Screenshots\Screenshot 2026-09-12 121543.png">
            Color Cake – Rs. 300
        </div>

        <div class="cake">
            <img src="C:\Users\91882\Pictures\Screenshots\Screenshot 2026-09-12 121646.png">
            Brown Cake – Rs. 200
        </div>

        <div class="cake">
            <img src="C:\Users\91882\Pictures\Screenshots\Screenshot 2026-09-12 121723.png">
            Milky Cake – Rs. 250
        </div>

        <div class="cake">
            <img src="C:\Users\91882\Pictures\Screenshots\Screenshot 2026-09-12 121814.png">
            Black Forest Cake – Rs. 350
        </div>

    </div>

    <h2>Order Cake</h2>

    <label>Color Cake(Quantity)</label>
    <input type="number" id="color" value="2">

    <label>Brown Cake(Quantity)</label>
    <input type="number" id="brown" value="1">

    <label>Milky Cake(Quantity)</label>
    <input type="number" id="milky" value="2">

    <label>Black Forest Cake(Quantity)</label>
    <input type="number" id="black" value="1">

    <button onclick="placeOrder()">Place Order</button>

    <hr>

    <div class="bill">
        Purchase Order Bill!!
    </div>

    <div class="price">
        <div class="total">Total Price</div>
        <div class="amount">Rs.<span id="result">1650</span></div>
    </div>


    <script>

        function placeOrder() {

            let color = parseInt(document.getElementById("color").value);
            let brown = parseInt(document.getElementById("brown").value);
            let milky = parseInt(document.getElementById("milky").value);
            let black = parseInt(document.getElementById("black").value);

            let total =
                (color * 300) +
                (brown * 200) +
                (milky * 250) +
                (black * 350);

            document.getElementById("result").innerHTML = total;
        }

    </script>

</body>
</html>

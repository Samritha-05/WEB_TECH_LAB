<!DOCTYPE html>
<html>
<head>
    <title>Shortest and Longest Word</title>
</head>
<body>

<script>

function findWords(str) {

    var arr = str.split(" ");

    var shortest = arr[0];
    var longest = arr[0];

    for (var i = 1; i < arr.length; i++) {

        if (arr[i].length < shortest.length) {
            shortest = arr[i];
        }

        if (arr[i].length > longest.length) {
            longest = arr[i];
        }
    }

    document.write("Shortest: '" + shortest + "'<br>");
    document.write("Longest: '" + longest + "'");

}

findWords("Web Development Tutorial");

</script>

</body>
</html>

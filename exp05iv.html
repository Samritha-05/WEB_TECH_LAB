<!DOCTYPE html>
<html>
<head>
    <title>Currency Converter</title>
</head>
<body>

<fieldset>

Convert
<input type="text" id="data">

<select id="from">
    <option>Indian Rupee</option>
    <option>US Dollar</option>
</select>

to

<select id="to">
    <option>US Dollar</option>
    <option>Indian Rupee</option>
</select>

<button onclick="convert()">Calculate</button>

<span id="answer"></span>

</fieldset>

<script>

function convert() {

    var value = parseFloat(
        document.getElementById("data").value
    );


    var from = document.getElementById("from").selectedIndex;

    var to = document.getElementById("to").selectedIndex;

    var result;

    if (from == 0 && to == 0) {

        result = value * 0.015;

    }

    else if (from == 0 && to == 1) {

        result = value;

    }

    else if (from == 1 && to == 0) {

        result = value;

    }
    else {

        result = value * 67.12;

    }
    document.getElementById("answer").innerHTML = result;
}

</script>

</body>
</html>

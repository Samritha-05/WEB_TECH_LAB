<!DOCTYPE html>
<html>
<head>
    <title>Mouse Events</title>
</head>

<body>

<h1>Mouse Events</h1>

<p id="para1"
   onmouseover="incSize()"
   onmouseout="decSize()">
   Move your mouse over me to zoom in...
</p>

<script>

function incSize() {
    document.getElementById("para1").style.fontSize = "28px";
}

function decSize() {
    document.getElementById("para1").style.fontSize = "16px";
}

</script>

</body>
</html>
